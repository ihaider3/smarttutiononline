<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Smart Tuition Online</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a1128;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.12);
      --primary-accent: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0a1128 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card-404 {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .logo-img {
      height: 52px;
      width: auto;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--primary-accent);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 44px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 14px;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 12px;
      box-shadow: 0 8px 20px -4px rgba(245, 158, 11, 0.4);
      transition: all 0.25s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -4px rgba(245, 158, 11, 0.6);
    }
  </style>
</head>
<body>
  <main class="card-404">
    <a href="/">
      <img src="./assets/logo.png" alt="Smart Tuition Online" class="logo-img">
    </a>
    <div><span class="badge">Error 404</span></div>
    <h1>Page Not Found</h1>
    <p>Sorry, the page you are looking for doesn't exist or has been moved. Explore our 1-on-1 UK tutoring programmes on the homepage.</p>
    <a href="/" class="home-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Return to Homepage
    </a>
  </main>
</body>
</html>
